
services:

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: hostelcare-mongodb
    restart: unless-stopped

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5


  # Node.js Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: hostelcare-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/hostelcare
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:8080

    depends_on:
      mongodb:
        condition: service_healthy

    volumes:
      - uploads_data:/app/uploads


  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: hostelcare-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend


volumes:
  mongodb_data:
  uploads_data:
